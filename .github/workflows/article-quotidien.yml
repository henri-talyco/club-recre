name: Article quotidien

# Chaque matin, le robot prend le premier sujet de scripts/file-sujets.json,
# fait rediger l'article, verifie que le site build, et ouvre une pull request.
#
# Pour publier directement sur main sans relecture, passer MODE a "direct".

on:
  schedule:
    # Quatre creneaux nocturnes, et non un seul. GitHub ne garantit pas l'heure
    # d'un cron : il le met en file et le retard grandit sur les depots peu
    # actifs. Constate ici du 26 au 28/08/2026 avec un cron unique a 00h17 UTC,
    # parti a 01h56, puis 09h42, puis 11h19, soit 13h19 a Paris, en plein dans
    # la journee de travail alors que le but etait justement de l'eviter.
    #
    # Six departs pour deux articles par jour : les deux premiers qui sortent
    # ecrivent, les suivants s'arretent sur la garde du job "garde". Il en faut
    # plus que d'articles voulus, puisqu'un depart peut partir avec des heures
    # de retard. En heure d'ete : 00h17, 01h23, 02h31, 03h43, 04h53 et 05h37.
    - cron: "17 22 * * *"
    - cron: "23 23 * * *"
    - cron: "31 0 * * *"
    - cron: "43 1 * * *"
    - cron: "53 2 * * *"
    - cron: "37 3 * * *"
  workflow_dispatch:
    inputs:
      sujet:
        description: "Slug precis a traiter (vide = premier de la file)"
        required: false
      effort:
        description: "Effort du modele (low, medium, high, xhigh, max)"
        required: false
        default: "high"

env:
  MODE: direct # "direct" publie sans relecture, "pr" ouvre une pull request a valider
  ARTICLES_PAR_JOUR: "2" # combien d'articles au maximum dans une meme journee

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: article-quotidien
  cancel-in-progress: false

jobs:
  # Les six crons nocturnes visent ARTICLES_PAR_JOUR articles : les premiers
  # departs ecrivent, les suivants s'arretent ici sans reveiller le modele ni
  # entamer les quotas. Un declenchement manuel passe outre, c'est le bouton.
  garde:
    runs-on: ubuntu-latest
    outputs:
      rediger: ${{ steps.compte.outputs.rediger }}
    steps:
      - uses: actions/checkout@v4

      - name: Compter les articles deja publies aujourd'hui
        id: compte
        run: |
          jour=$(TZ=Europe/Paris date +%F)
          deja=$(grep -rlE "^pubDate: \"?$jour\"?$" src/content/articles/ 2>/dev/null | wc -l | tr -d ' ')
          echo "Le $jour, $deja article(s) publie(s), plafond $ARTICLES_PAR_JOUR."
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "rediger=oui" >> "$GITHUB_OUTPUT"
            echo "::notice::Declenchement manuel, la garde du jour ne s'applique pas."
          elif [ "$deja" -lt "$ARTICLES_PAR_JOUR" ]; then
            echo "rediger=oui" >> "$GITHUB_OUTPUT"
          else
            echo "rediger=non" >> "$GITHUB_OUTPUT"
            echo "::notice::Le quota du jour est atteint ($deja/$ARTICLES_PAR_JOUR), rien a ecrire."
          fi

  rediger:
    needs: garde
    if: needs.garde.outputs.rediger == 'oui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Installer les dependances
        run: |
          npm ci
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Lister les articles deja en attente de relecture
        id: attente
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          slugs=$(gh pr list --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("article/")) | sub("^article/"; "")] | join(",")')
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"

      - name: Rediger l'article
        id: redaction
        env:
          # Token d'abonnement, pas de cle API : la generation ne coute rien.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Illustration de l'article. Absente, l'article part sans photo : le
          # site sait afficher un degrade a la place, rien ne casse.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXCLUS: ${{ steps.attente.outputs.slugs }}
          SUJET: ${{ inputs.sujet }}
          EFFORT: ${{ inputs.effort || 'high' }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Le secret CLAUDE_CODE_OAUTH_TOKEN est absent. Génère-le avec 'claude setup-token' puis ajoute-le dans Settings, Secrets and variables, Actions."
            exit 1
          fi
          set +e
          node scripts/redige-article.mjs
          code=$?
          set -e
          if [ $code -eq 3 ]; then
            echo "vide=1" >> "$GITHUB_OUTPUT"
            echo "::notice::File de sujets vide, rien a publier."
            exit 0
          fi
          exit $code

      - name: Verifier que le site build
        if: steps.redaction.outputs.vide != '1'
        run: npm run build

      - name: Ouvrir la pull request
        if: steps.redaction.outputs.vide != '1' && env.MODE == 'pr'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUG: ${{ steps.redaction.outputs.slug }}
          TITRE: ${{ steps.redaction.outputs.titre }}
          KEYWORD: ${{ steps.redaction.outputs.keyword }}
          RESTANTS: ${{ steps.redaction.outputs.restants }}
          MOTS: ${{ steps.redaction.outputs.mots }}
          COUT: ${{ steps.redaction.outputs.cout }}
          SERIE: ${{ github.run_id }}
        run: |
          git config user.name "Robot Club Récré"
          git config user.email "actions@github.com"
          git checkout -b "article/$SLUG"
          git add src/content/articles scripts/file-sujets.json public/img/articles
          git commit -m "article: $SLUG"
          git push --force-with-lease origin "article/$SLUG"
          gh pr create \
            --title "Article : $TITRE" \
            --body "$(printf '%s\n' \
              "Expression cible : \`$KEYWORD\`" \
              "" \
              "- $MOTS mots" \
              "- coût de génération : $COUT" \
              "- il reste $RESTANTS sujets dans la file" \
              "" \
              "Le site build. Relis, puis merge pour publier (Vercel déploie en 30 s)." \
              "" \
              "Si l'article ne va pas : ferme la PR. Le sujet repassera demain. Pour l'écarter définitivement, retire-le aussi de \`scripts/file-sujets.json\`." \
              "" \
              "[Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/$SERIE)")" \
            --head "article/$SLUG" \
            --base main

      - name: Publier directement sur main
        if: steps.redaction.outputs.vide != '1' && env.MODE == 'direct'
        env:
          SLUG: ${{ steps.redaction.outputs.slug }}
          TITRE: ${{ steps.redaction.outputs.titre }}
          MOTS: ${{ steps.redaction.outputs.mots }}
          RESTANTS: ${{ steps.redaction.outputs.restants }}
        run: |
          git config user.name "Robot Club Récré"
          git config user.email "actions@github.com"
          git add src/content/articles scripts/file-sujets.json public/img/articles
          git commit -m "article: $SLUG"
          git pull --rebase --quiet origin main
          git push origin HEAD:main
          echo "::notice::Publié : $TITRE ($MOTS mots). Il reste $RESTANTS sujets."

      # Un push fait par un workflow ne declenche pas d'autre workflow (garde-fou
      # anti-boucle de GitHub) : deploy-cloudflare.yml ne partirait jamais en mode
      # direct. On met donc en ligne ici, le build de l'etape precedente est deja la.
      - name: Mettre en ligne sur Cloudflare
        if: steps.redaction.outputs.vide != '1' && env.MODE == 'direct'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Alerter quand la file s'epuise
        if: steps.redaction.outputs.vide == '1' || fromJSON(steps.redaction.outputs.restants || '99') < 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESTANTS: ${{ steps.redaction.outputs.restants || '0' }}
        run: |
          ouvertes=$(gh issue list --state open --search "File de sujets in:title" --json number --jq 'length')
          if [ "$ouvertes" = "0" ]; then
            gh issue create \
              --title "File de sujets bientôt vide ($RESTANTS restants)" \
              --body "$(printf '%s\n' \
                "Le robot d'articles arrive au bout de \`scripts/file-sujets.json\`, il reste $RESTANTS sujets." \
                "" \
                "Pour la réalimenter, ouvre une session Claude Code sur le repo et demande les prochains sujets à partir de la Search Console : les requêtes en position 8 à 30 qui ont des impressions et pas encore d'article dédié, plus les extensions du motif ville x âge qui fonctionne déjà.")"
          fi
