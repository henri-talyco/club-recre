name: Déployer sur Cloudflare

# Build Astro puis mise en ligne sur Cloudflare Workers, à chaque push sur main
# (donc à chaque merge d'un article). Remplace le déploiement automatique Vercel.
#
# Prérequis : le secret CLOUDFLARE_API_TOKEN, créé dans le dashboard Cloudflare
# (My Profile, API Tokens, modèle « Edit Cloudflare Workers »).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Mise en ligne
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Le secret CLOUDFLARE_API_TOKEN est absent. Crée-le dans le dashboard Cloudflare (My Profile, API Tokens, modèle « Edit Cloudflare Workers »), puis ajoute-le dans Settings, Secrets and variables, Actions."
            exit 1
          fi
          npx wrangler deploy
